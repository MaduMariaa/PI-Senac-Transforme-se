<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Banho</title>

    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/agendamento.css">
    <link rel="stylesheet" href="../imagens/logo.png">
    <link rel="stylesheet" href="../index.html">
    <link rel="shortcut icon" href="../imagens/Design_sem_nome__1_-removebg-preview.png" type="image/x-icon">
</head>
<body>
    <header class="navbar">            
        <a href="../index.html">
            <img class="logo" src="../imagens/logo.png" alt="Logo da Empresa">
        </a>
    </header>
<body>
    <main class="container">
        <h1>Agendar Banho</h1>
        <p>Preencha os dados abaixo para realizar o agendamento.</p>
        <p class="horario">Horário de funcionamento:<br>Segunda a sexta, das 09h às 18h</p>

        <form id="agendamentoForm">

            <div class="campo">
                <label for="tutor">Nome do Tutor</label>
                <input type="text" id="tutor" name="tutor" placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="especie">Especie</label>
                <div class="select-wrapper">
                    <select id="especie" name="especie" required>
                        <option value="cachorro">Cachorro</option>
                        <option value="gato">Gato</option>
                        <option value="roedor">Roedor</option>
                    </select>
                </div>
            </div>
            <div class="campo">
                <label for="pet">Nome do Pet</label>
                <input type="text" id="pet" name="pet" placeholder="Nome do pet" required>
            </div>

            <div class="campo">
                <label for="porte">Porte do Pet</label>
                <div class="select-wrapper">
                    <select id="porte" name="porte" required>
                        <option value="" selected disabled>Selecione</option>
                        <option value="pequeno">Pequeno</option>
                        <option value="Gato">Médio</option>
                        <option value="grande">Grande</option>
                    </select>
                </div>
            </div>
<div class="campo">
  <label>Selecione os Serviços:</label>
  <p>Incluso corte de unhas</p>
  <div class="dropdown-multiplo">
    <!-- O botão que abre/fecha o menu e mostra o resumo -->
    <div class="dropdown-botao" onclick="alternarDropdownM()">
      <span id="texto-resumo">Selecione uma ou mais opções.</span>
    </div>
    
    <!-- A lista suspensa com os checkboxes -->
    <div id="dropdown-lista" class="dropdown-lista">
      <label class="opcao-checkbox">
        <input type="checkbox" value="Banho" onchange="atualizarResumoM()"> Banho
      </label>
      <label class="opcao-checkbox">
        <input type="checkbox" value="Tosa" onchange="atualizarResumoM()"> Tosa
      </label>
      <label class="opcao-checkbox">
        <input type="checkbox" value="Hidratação" onchange="atualizarResumoM()"> Hidratação
      </label>
      <label class="opcao-checkbox">
        <input type="checkbox" value="Corte de Unha" onchange="atualizarResumoM()"> Coloração
      </label>
    </div>
  </div>
</div>

            <div class="campo">
                <label for="periodo">Período Desejado</label>
                <div class="select-wrapper">
                    <select id="periodo" name="periodo" required>
                        <option value="" selected disabled>Selecione</option>
                        <option value="manha">Manhã</option>
                        <option value="tarde">Tarde</option>
                    </select>
                </div>
            </div>

            <div class="campo">
                <label for="obs">Observações</label>
                <textarea id="obs" name="obs" rows="4" placeholder="Informações adicionais"></textarea>
            </div>

            <div class="campo">
  <!-- Linha do Interruptor -->
        <div class="toggle-row">
            <label for="toggle-taxi-dog">Deseja contratar o Táxi Dog?</label>
            <label class="switch">
                <input type="checkbox" id="toggle-taxi-dog" onchange="alternarEndereco()">
                <span class="slider"></span>
            </label>
        </div>

  <!-- Aba invisível que vai deslizar para baixo -->
        <div id="aba-endereco" class="aba-endereco">
        <label for="input-endereco" class="legenda" >Endereço completo: </label>
            <input type="text" id="input-endereco" placeholder="Ex: Av. Nossa Sra. do Sabará, 3361 - Bloco 3" required>
        </div>
        </div>

            <p class="resumo" id="resumo" aria-live="polite"></p>

            <button type="submit">Agendar Banho</button>
            <p class="legenda">
                A disponibilidade será confirmada posteriormente pela equipe do Studio Pet via WhatsApp.
            </p>
        </form>
    </main>

    <script src="../js/jsAgedamento.js"></script>
</body>
</html>
