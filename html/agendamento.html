    <div class="container">
        <h1>Agendar Banho</h1>
        <p>Preencha os dados abaixo para realizar o agendamento.</p>

        <form id="agendamentoForm">

            <label for="tutor"><strong>Nome do Tutor</strong></label>
            <input type="text" id="tutor" placeholder="Digite seu nome" required>

            <label for="pet"><strong>Nome do Pet</strong></label>
            <input type="text" id="pet" placeholder="Nome do pet" required>

            <label for="porte"><strong>Porte do Pet</strong></label>
            <select id="porte">
                <option>Pequeno</option>
                <option>Médio</option>
                <option>Grande</option>
            </select>

            <label for="telefone"><strong>Telefone</strong></label>
            <input type="number" id="telefone" placeholder="(00) 00000-0000" required>

            <label for="data"><strong>Data</strong></label>
            <input type="date" id="data" required>

            <label for="hora"><strong>Horário</strong></label>
            <input type="time" id="hora" required>

            <label for="obs"><strong>Observações</strong></label>
            <textarea id="obs" rows="4" placeholder="Informações adicionais"></textarea>

            <button type="submit">Agendar Banho</button>

        </form>
    </div>
    <script src="js/script.js"></script>
