<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de Banho</title>

    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/agendamento.css">
    <link rel="stylesheet" href="../imagens/logo.png">
    <link rel="stylesheet" href="../index.html">
    <link rel="shortcut icon" href="../imagens/Design_sem_nome__1_-removebg-preview.png" type="image/x-icon">
</head>
<body>
    <header class="navbar">            
        <a href="../index.html">
            <img class="logo" src="../imagens/logo.png" alt="Logo da Empresa">
        </a>
    </header>

    <div class="container">
        <h1>Agendar Banho</h1>
        <p>Preencha os dados abaixo para realizar o agendamento.</p>

        <form id="agendamentoForm">

            <label for="tutor">Nome do Tutor</label>
            <input type="text" id="tutor" placeholder="Digite seu nome" required>

            <label for="pet">Nome do Pet</label>
            <input type="text" id="pet" placeholder="Nome do pet" required>

            <label for="porte">Porte do Pet</label>
            <select id="porte">
                <option>Pequeno</option>
                <option>Médio</option>
                <option>Grande</option>
            </select>

            <label for="data">Data</label>
            <input type="date" id="data" required>

            <label for="hora">Horário</label>
            <input type="time" id="hora" required>

            <label for="obs">Observações</label>
            <textarea id="obs" rows="4" placeholder="Informações adicionais"></textarea>

            <button type="submit">Agendar Banho</button>

        </form>
    </div>
    <script src="../js/jsAgedamento.js"></script>
</body>
</html>
